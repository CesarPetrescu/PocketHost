name: codeql

# Static analysis across every language in the repo that CodeQL can extract.
#
# build-mode is NOT uniform, and getting it wrong is the most likely silent
# failure here: `none` on java-kotlin skips all Kotlin with only a warning, and
# `none` is invalid for go. Each matrix entry therefore carries its own mode.
#
# Bash has no CodeQL extractor at all — shellcheck and actionlint in ci.yml are
# the only coverage the shell scripts get.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query pack finds existing code without
    # waiting for someone to push.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          # Lints the workflow files themselves for injection and permission
          # problems.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.26.x'
          cache: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}
          queries: security-and-quality

      # autobuild looks for a build file at the repository root; this project's
      # Gradle build lives in android/, so drive it explicitly.
      - name: build android for extraction
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
