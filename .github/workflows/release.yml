name: release

# Tag-driven release build. Produces APKs, an SBOM and build provenance, and
# publishes them as a DRAFT release so a human still makes the call.
#
# This workflow deliberately refuses to publish a debug-signed APK. The release
# build type in app/build.gradle.kts currently uses signingConfigs["debug"],
# which means every machine signs with a different throwaway key and no user can
# ever upgrade between two builds. Configure the signing secrets below, or the
# release job stops.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or ref to build
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # A workflow that publishes artifacts must not restore a cache that
          # pull-request jobs are able to write.
          cache-disabled: true

      # The tag must match what the app reports, or the release is mislabelled.
      - name: tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "tag=${tag} versionName=${name}"
          [[ "$tag" == "$name" ]] || { echo "::error::tag v${tag} does not match versionName ${name}"; exit 1; }

      - name: configure signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: assembleRelease
        working-directory: android
        env:
          POCKETHOST_KEYSTORE: ${{ runner.temp }}/release.jks
          POCKETHOST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POCKETHOST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POCKETHOST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # Refuse to ship an APK signed with the Android debug key, and refuse one
      # that carries only a v1 JAR signature: Android 11+ will not install an
      # apk targeting API 30+ without a v2 or v3 signing block.
      - name: verify signatures
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          fail=0
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            out="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)" || { echo "$out"; fail=1; continue; }
            echo "$out"
            grep -q 'Verified using v2 scheme: true\|Verified using v3 scheme: true' <<<"$out" \
              || { echo "::error::$apk has no v2/v3 signature block"; fail=1; }
            grep -q 'CN=Android Debug' <<<"$out" \
              && { echo "::error::$apk is signed with the Android debug key"; fail=1; }
          done
          exit "$fail"

      # ABI splits sharing one versionCode cannot be published to the same track.
      - name: verify split versionCodes are distinct
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          codes=$(for apk in android/app/build/outputs/apk/release/*.apk; do
                    "$aapt2" dump badging "$apk" | grep -oP "versionCode='\K[0-9]+"
                  done)
          echo "$codes"
          [[ "$(echo "$codes" | sort -u | wc -l)" -eq "$(echo "$codes" | wc -l)" ]] \
            || { echo "::error::ABI split APKs share a versionCode"; exit 1; }

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: pockethost-sbom.spdx.json

      # Signed, verifiable statement of which workflow run and commit produced
      # each APK.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'android/app/build/outputs/apk/release/*.apk'

      - name: checksums
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
            pockethost-sbom.spdx.json
          retention-days: 30

  publish:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apks
          path: dist
      - name: create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/*
