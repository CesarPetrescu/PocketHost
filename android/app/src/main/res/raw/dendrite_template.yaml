# PocketHost Dendrite (Matrix homeserver) config template.
# Placeholders are substituted at runtime by ServicePreferences.writeDendriteConfig():
#   __PH_SERVER_NAME__   Matrix server_name from settings
#   __PH_MATRIX_DIR__    absolute app-private matrix data dir (AppPaths.matrixRoot)
#   __PH_REG_DISABLED__  true/false (registration gate)
#   __PH_REG_SECRET__    shared-secret registration token
version: 2
global:
  server_name: __PH_SERVER_NAME__
  key_id: ed25519:auto
  private_key: __PH_MATRIX_DIR__/matrix_key.pem
  old_private_keys: []
  key_validity_period: 168h0m0s
  database:
    connection_string: ""
    max_open_conns: 90
    max_idle_conns: 2
    conn_max_lifetime: -1
  disable_federation: true
  presence:
    enable_inbound: false
    enable_outbound: false
  jetstream:
    storage_path: __PH_MATRIX_DIR__/jetstream
    addresses: []
    topic_prefix: Dendrite
    in_memory: true
    disable_tls_validation: true
    credentials_path: ""
  metrics:
    enabled: false
  dns_cache:
    enabled: false
  server_notices:
    enabled: true
    local_part: _server
    display_name: Server Alert
    avatar_url: ""
    room_name: Server Alert
  report_stats:
    enabled: false
  cache:
    max_size_estimated: 1073741824
    max_age: 1h0m0s
app_service_api:
  disable_tls_validation: true
  config_files: []
client_api:
  registration_disabled: __PH_REG_DISABLED__
  registration_requires_token: false
  registration_shared_secret: __PH_REG_SECRET__
  guests_disabled: true
  enable_registration_captcha: false
  turn:
    turn_user_lifetime: ""
    turn_uris: []
  rate_limiting:
    enabled: false
    threshold: 5
    cooloff_ms: 500
federation_api:
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_federationapi.db
  send_max_retries: 16
  disable_tls_validation: false
  disable_http_keepalives: true
  key_perspectives: []
key_server:
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_keyserver.db
media_api:
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_mediaapi.db
  base_path: __PH_MATRIX_DIR__/media
  max_file_size_bytes: 10485760
  dynamic_thumbnails: false
  max_thumbnail_generators: 10
  thumbnail_sizes:
  - width: 32
    height: 32
    method: crop
  - width: 96
    height: 96
    method: crop
  - width: 640
    height: 480
    method: scale
room_server:
  default_room_version: "10"
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_roomserver.db
sync_api:
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_syncapi.db
  real_ip_header: ""
  search:
    enabled: false
    index_path: __PH_MATRIX_DIR__/searchindex
    in_memory: true
    language: en
user_api:
  bcrypt_cost: 10
  openid_token_lifetime_ms: 3600000
  account_database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_userapi.db
  auto_join_rooms: []
  worker_count: 4
relay_api:
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_relayapi.db
mscs:
  mscs: []
  database:
    connection_string: file:__PH_MATRIX_DIR__/dendrite_mscs.db
tracing:
  enabled: false
logging:
- type: std
  level: info
  params:
    path: __PH_MATRIX_DIR__/log
